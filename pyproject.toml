[project]
name = "rethink"
version = "0.1.0"
description = "A competitive programming companion that tracks your growth and guides your thinking."
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Settings / config
    "pydantic-settings>=2.5.0",
    # HTTP client for Codeforces API
    "httpx>=0.27.0",
    # Encryption for stored credentials
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx",  # for FastAPI TestClient
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
